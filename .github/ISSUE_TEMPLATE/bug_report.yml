name: Bug 报告
description: 记录可复现的问题
labels: [bug, "status: triage"]
body:
  - type: checkboxes
    attributes:
      label: 提交前
      options:
        - label: 我已查阅现有问题，并移除了密钥、Cookie、授权码和私人原文。
          required: true
  - type: input
    id: version
    attributes:
      label: 扩展版本
      placeholder: 0.7.1
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Chrome 与操作系统版本
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 发生在哪个模块
      options: [阅读浮框, 知识库, 生成任务, 模型连接, Google 同步, 其他]
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 使用可公开的最小例子；模型问题注明连接方式和模型名。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果与错误信息
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 脱敏截图或最小日志
